<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 276 276" width="256" height="256">
  <defs>
    <linearGradient id="ribbonGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="ribbonShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="foldGrad" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="docShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1e1b4b" flood-opacity="0.2"/>
    </filter>
    <filter id="ribbonShadow">
      <feDropShadow dx="1.5" dy="0" stdDeviation="2" flood-color="#312E81" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Document body -->
  <path d="M48 12 L172 12 L208 48 L208 236 C208 241 204 244 200 244 L56 244 C52 244 48 241 48 236 Z"
        fill="url(#paperGrad)" filter="url(#docShadow)"
        stroke="#C7D2FE" stroke-width="1.2"/>

  <!-- Dog-ear fold -->
  <path d="M172 12 L172 40 C172 45 176 48 180 48 L208 48 Z"
        fill="url(#foldGrad)" stroke="#C7D2FE" stroke-width="0.8"/>

  <!-- Left ribbon: slightly overflows left edge for depth -->
  <rect x="44" y="76" width="68" height="80" rx="4"
        fill="url(#ribbonGrad)" filter="url(#ribbonShadow)"/>
  <rect x="44" y="76" width="10" height="80" rx="4"
        fill="url(#ribbonShine)"/>

  <!-- "W" — centered in ribbon -->
  <text x="78" y="132"
        font-family="'Segoe UI', 'SF Pro Display', 'Inter', system-ui, sans-serif"
        font-size="48" font-weight="900" fill="#FFFFFF"
        text-anchor="middle"
        letter-spacing="-2">W</text>

  <!-- Content lines beside ribbon -->
  <rect x="126" y="88"  width="64" height="6" rx="3" fill="#A5B4FC"/>
  <rect x="126" y="104" width="50" height="5" rx="2.5" fill="#CBD5E1"/>
  <rect x="126" y="118" width="56" height="5" rx="2.5" fill="#CBD5E1"/>
  <rect x="126" y="132" width="40" height="5" rx="2.5" fill="#E2E8F0"/>

  <!-- Body text lines -->
  <rect x="68" y="176" width="120" height="5" rx="2.5" fill="#CBD5E1"/>
  <rect x="68" y="190" width="100" height="5" rx="2.5" fill="#E2E8F0"/>
  <rect x="68" y="204" width="108" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="68" y="216" width="72"  height="4" rx="2" fill="#F1F5F9"/>
</svg>
