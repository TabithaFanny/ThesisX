<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- 中风险图标 - 警告圆形 -->
  <defs>
    <linearGradient id="medRiskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6ad55"/>
      <stop offset="100%" stop-color="#ed8936"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 圆形主体 -->
  <circle cx="12" cy="12" r="10"
          fill="url(#medRiskGrad)" stroke="#dd6b20" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- 感叹号 -->
  <line x1="12" y1="7" x2="12" y2="13" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="12" cy="16" r="1.2" fill="#ffffff"/>
</svg>
