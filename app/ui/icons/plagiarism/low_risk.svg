<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- 低风险图标 - 对勾圆形 -->
  <defs>
    <linearGradient id="lowRiskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#68d391"/>
      <stop offset="100%" stop-color="#48bb78"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 圆形主体 -->
  <circle cx="12" cy="12" r="10"
          fill="url(#lowRiskGrad)" stroke="#38a169" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- 对勾 -->
  <path d="M7 12l3.5 3.5L17 8" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
