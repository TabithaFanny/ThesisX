[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thesisx"
version = "1.0.0"
description = "学术论文撰写与表格处理工具"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "ThesisX Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # 排除的目录
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv312
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["venv312/*", "build/*", "dist/*"]
known_first_party = ["app"]
known_third_party = ["PyQt6", "requests", "markdown", "pygments"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.pylint.main]
# 使用多个进程加速检查
jobs = 0
# 递归检查子目录
recursive = true
# 忽略的文件或目录
ignore = ["venv312", "build", "dist", ".git"]
# 忽略的文件模式
ignore-patterns = ["test_.*\\.py", ".*_test\\.py"]

[tool.pylint.messages_control]
# 最大行长度
max-line-length = 100
# 禁用的检查
disable = [
    "C0111",  # missing-docstring (我们会手动添加)
    "C0103",  # invalid-name (允许单字母变量名在特定上下文)
    "R0903",  # too-few-public-methods (dataclass 可能只有属性)
    "R0913",  # too-many-arguments (某些函数需要多个参数)
    "W0212",  # protected-access (允许访问 _private 成员)
    "C0301",  # line-too-long (由 black 处理)
    "C0330",  # bad-continuation (由 black 处理)
]

[tool.pylint.format]
# 最大行长度
max-line-length = 100
# 缩进字符串
indent-string = "    "

[tool.pylint.design]
# 最大属性数
max-attributes = 15
# 最大分支数
max-branches = 15
# 最大局部变量数
max-locals = 20
# 最大返回语句数
max-returns = 8
# 最大语句数
max-statements = 60

[tool.pylint.similarities]
# 最小相似行数（用于检测重复代码）
min-similarity-lines = 6
# 忽略注释
ignore-comments = true
# 忽略文档字符串
ignore-docstrings = true
# 忽略导入语句
ignore-imports = true

[tool.pytest.ini_options]
# 测试目录
testpaths = ["tests"]
# Python 文件模式
python_files = ["test_*.py", "*_test.py"]
# Python 类模式
python_classes = ["Test*"]
# Python 函数模式
python_functions = ["test_*"]
# 添加选项
addopts = [
    "-v",                    # 详细输出
    "--strict-markers",      # 严格标记模式
    "--tb=short",           # 简短的回溯信息
    "--cov=app",            # 代码覆盖率
    "--cov-report=term-missing",  # 显示未覆盖的行
    "--cov-report=html",    # 生成 HTML 报告
    "--cov-fail-under=10",  # 最低覆盖率阈值（逐步提高）
]
# 标记
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
# 源代码目录
source = ["app"]
# 忽略的文件
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv312/*",
]

[tool.coverage.report]
# 精度
precision = 2
# 最低覆盖率阈值（逐步提高）
fail_under = 10
# 显示缺失的行
show_missing = true
# 跳过覆盖的文件
skip_covered = false
# 排除的行
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
# Python 版本
python_version = "3.10"
# 警告未类型化的定义
warn_return_any = true
warn_unused_configs = true
# 禁用隐式可选
no_implicit_optional = true
# 严格可选
strict_optional = true
# 排除的目录
exclude = [
    "venv312",
    "build",
    "dist",
]

[[tool.mypy.overrides]]
module = [
    "PyQt6.*",
    "fitz",
    "pdfplumber",
    "openpyxl.*",
    "docx.*",
    "pptx.*",
    "PyPDF2.*",
    "markdownify",
    "markdown",
    "pygments.*",
]
ignore_missing_imports = true
