<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1e40af"/></marker></defs>
<rect x="0" y="0" width="1700" height="900" rx="0" fill="#f8fafc" stroke="none" stroke-width="1" />
<text x="40" y="54" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0f172a" text-anchor="start">Workbench 关键交互 / 状态机</text>
<rect x="80" y="120" width="280" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
<text x="104" y="158" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#1e40af" text-anchor="start">上传参考 PPT</text>
<text x="104" y="196" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start">idle → uploading → parsed → analyzing → ready</text>
<rect x="430" y="120" width="280" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
<text x="454" y="158" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#1e40af" text-anchor="start">点击参考页</text>
<text x="454" y="196" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start">selectedReferenceSlideId 更新</text>
<text x="454" y="220" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start">左二显示该页 Prompt</text>
<rect x="780" y="120" width="280" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
<text x="804" y="158" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#1e40af" text-anchor="start">AI 对话生成计划</text>
<text x="804" y="196" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start">user message → thinking → deckBrief ready</text>
<text x="804" y="220" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start">右一生成新页 Prompt 列表</text>
<rect x="1130" y="120" width="280" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
<text x="1154" y="158" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#1e40af" text-anchor="start">生成单页</text>
<text x="1154" y="196" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start">pending → generating → generated</text>
<text x="1154" y="220" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start">右二显示结果并可微调</text>
<rect x="80" y="430" width="280" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
<text x="104" y="468" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#1e40af" text-anchor="start">保存与导出</text>
<text x="104" y="506" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start">unsaved → saving → saved</text>
<text x="104" y="530" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start">PPTX export → warnings/success</text>
<rect x="430" y="430" width="280" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
<text x="454" y="468" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#1e40af" text-anchor="start">修改指定页</text>
<text x="454" y="506" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start">用户反馈第 X 页 → 更新该页 Prompt</text>
<text x="454" y="530" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start">不重写全套 slides</text>
<rect x="780" y="430" width="280" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
<text x="804" y="468" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#1e40af" text-anchor="start">API 运行模式</text>
<text x="804" y="506" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start">后端 env key 优先</text>
<text x="804" y="530" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start">mock/real/auto fallback</text>
<rect x="1130" y="430" width="280" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
<text x="1154" y="468" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#1e40af" text-anchor="start">错误恢复</text>
<text x="1154" y="506" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start">失败不白屏</text>
<text x="1154" y="530" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#334155" text-anchor="start">保留输入 + 显示结构化错误</text>
<line x1="360" y1="215" x2="430" y2="215" stroke="#1e40af" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="710" y1="215" x2="780" y2="215" stroke="#1e40af" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1060" y1="215" x2="1130" y2="215" stroke="#1e40af" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="220" y1="310" x2="220" y2="430" stroke="#1e40af" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="570" y1="310" x2="570" y2="430" stroke="#1e40af" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="920" y1="310" x2="920" y2="430" stroke="#1e40af" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1270" y1="310" x2="1270" y2="430" stroke="#1e40af" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="80" y="720" width="1330" height="90" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="1" />
<text x="110" y="755" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#c2410c" text-anchor="start">关键验收</text>
<text x="110" y="785" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#7c2d12" text-anchor="start">用户应能在一个界面同时看到：原 PPT 页面、原页 Prompt、AI 对话、新页 Prompt、生成结果。无需跳 Step 才能理解生成链路。</text>
</svg>