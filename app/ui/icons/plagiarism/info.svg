          fill="url(#infoGrad)" stroke="#2563eb" stroke-width="1.5"/>

  <!-- i 字母 -->
  <line x1="12" y1="11" x2="12" y2="17" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="12" cy="7.5" r="1.2" fill="#ffffff"/>
