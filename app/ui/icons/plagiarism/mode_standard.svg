<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- 标准模式图标 - 平衡天平 -->
  <defs>
    <linearGradient id="stdGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- 天平支柱 -->
  <line x1="12" y1="4" x2="12" y2="20" stroke="url(#stdGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- 天平横梁 -->
  <line x1="4" y1="9" x2="20" y2="9" stroke="url(#stdGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- 左盘 -->
  <path d="M4 9l1.5 6h3l1.5-6" stroke="url(#stdGrad)" stroke-width="1.5" fill="#dbeafe" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 右盘 -->
  <path d="M14 9l1.5 6h3l1.5-6" stroke="url(#stdGrad)" stroke-width="1.5" fill="#dbeafe" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 底座 -->
  <path d="M8 20h8" stroke="url(#stdGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 中心点 -->
  <circle cx="12" cy="9" r="1.5" fill="url(#stdGrad)"/>
</svg>
