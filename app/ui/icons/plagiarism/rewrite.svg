<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- 降重图标 - 现代化编辑笔+刷新暗示 -->
  <defs>
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- 编辑笔主体 -->
  <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"
        fill="url(#penGrad)" stroke="#6d28d9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 笔尖高光 -->
  <path d="M15 5l4 4" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

  <!-- 刷新箭头暗示（右上角） -->
  <path d="M20 8a1 1 0 0 1-1 1h-1.5" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M19 9l-1-1 1-1" stroke="#8b5cf6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- 笔迹线条 -->
  <path d="M2 22l1.5-5.5" stroke="#6d28d9" stroke-width="1.5" stroke-linecap="round"/>
</svg>
