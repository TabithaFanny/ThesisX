<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- 迭代图标 - 流畅循环箭头 -->
  <defs>
    <linearGradient id="iterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- 上方箭头 -->
  <path d="M17 2l4 4-4 4" stroke="url(#iterGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M3 11V9a4 4 0 0 1 4-4h14" stroke="url(#iterGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- 下方箭头 -->
  <path d="M7 22l-4-4 4-4" stroke="url(#iterGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M21 13v2a4 4 0 0 1-4 4H3" stroke="url(#iterGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

