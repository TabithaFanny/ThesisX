<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><title>本地历史存储</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}.title{font-size:28px;font-weight:800;fill:#0F172A}.h3{font-size:15px;font-weight:700;fill:#0F172A}.muted{font-size:12px;fill:#64748B}.tiny{font-size:11px;fill:#64748B}</style><rect width="1100" height="620" fill="#F6F8FC"/><rect x="32" y="32" width="1036" height="556" rx="26" fill="#fff" stroke="#DDE6F3" /><text x="70" y="86" class="title" text-anchor="start">本地历史存储</text><text x="70" y="116" class="muted" text-anchor="start">~/.wenbiao/runs 与旧 output 兼容读取</text><rect x="80" y="170" width="210" height="110" rx="18" fill="#EAF2FF" stroke="#BFDBFE" /><circle cx="112" cy="204" r="16" fill="#2563EB"/><text x="112" y="209" class="tiny" text-anchor="middle" fill="#fff">1</text><text x="140" y="206" class="h3" text-anchor="start">Request</text><text x="104" y="242" class="muted" text-anchor="start">PaperRequest / topic / journal</text><rect x="330" y="170" width="210" height="110" rx="18" fill="#fff" stroke="#DDE6F3" /><circle cx="362" cy="204" r="16" fill="#2563EB"/><text x="362" y="209" class="tiny" text-anchor="middle" fill="#fff">2</text><text x="390" y="206" class="h3" text-anchor="start">Context</text><text x="354" y="242" class="muted" text-anchor="start">paper_request.md 等上下文</text><rect x="580" y="170" width="210" height="110" rx="18" fill="#fff" stroke="#DDE6F3" /><circle cx="612" cy="204" r="16" fill="#2563EB"/><text x="612" y="209" class="tiny" text-anchor="middle" fill="#fff">3</text><text x="640" y="206" class="h3" text-anchor="start">Events</text><text x="604" y="242" class="muted" text-anchor="start">events.jsonl 逐行写入</text><rect x="830" y="170" width="210" height="110" rx="18" fill="#fff" stroke="#DDE6F3" /><circle cx="862" cy="204" r="16" fill="#2563EB"/><text x="862" y="209" class="tiny" text-anchor="middle" fill="#fff">4</text><text x="890"