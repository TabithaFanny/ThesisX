<rect x="50" y="760" width="1320" height="160" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
<text x="80" y="800" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#1e40af" text-anchor="start">实现原则</text>
<text x="80" y="835" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#334155" text-anchor="start">1. 默认主页面是 Workbench，不是五步向导；旧 Step Wizard 仅保留为 Legacy/Fallback。</text>
<text x="80" y="861" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#334155" text-anchor="start">2. 所有 AI 输出必须落入结构化对象：ReferenceSlidePrompt / WorkbenchDeckBrief / GeneratedSlidePrompt / RenderableSlide。</text>
<text x="80" y="887" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#334155" text-anchor="start">3. 生成结果必须继续进入 PPTJson / RenderSpec / export-pptx，不能用整页图片替代可编辑 PPTX。</text>
<text x="80" y="913" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#334155" text-anchor="start">4. API Key 由后端环境变量优先提供；前端设置页只是高级覆盖，不是主路径。</text>
</svg>