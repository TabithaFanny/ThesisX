<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><title>研究问题到理论框架</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}.title{font-size:28px;font-weight:800;fill:#0F172A}.h3{font-size:15px;font-weight:700;fill:#0F172A}.muted{font-size:12px;fill:#64748B}.tiny{font-size:11px;fill:#64748B}</style><rect width="1100" height="620" fill="#F6F8FC"/><rect x="32" y="32" width="1036" height="556" rx="26" fill="#fff" stroke="#DDE6F3" /><text x="70" y="86" class="title" text-anchor="start">研究问题到理论框架</text><text x="70" y="116" class="muted" text-anchor="start">变量、机制、解释路径三层映射</text><rect x="80" y="170" width="210" height="110" rx="18" fill="#EAF2FF" stroke="#BFDBFE" /><circle cx="112" cy="204" r="16" fill="#2563EB"/><text x="112" y="209" class="tiny" text-anchor="middle" fill="#fff">1</text><text x="140" y="206" class="h3" text-anchor="start">研究问题</text><text x="104" y="242" class="muted" text-anchor="start">用户输入模糊问题</text><rect x="330" y="170" width="210" height="110" rx="18" fill="#fff" stroke="#DDE6F3" /><circle cx="362" cy="204" r="16" fill="#2563EB"/><text x="362" y="209" class="tiny" text-anchor="middle" fill="#fff">2</text><text x="390" y="206" class="h3" text-anchor="start">概念抽取</text><text x="354" y="242" class="muted" text-anchor="start">主体/关系/场景</text><rect x="580" y="170" width="210" height="110" rx="18" fill="#fff" stroke="#DDE6F3" /><circle cx="612" cy="204" r="16" fill="#2563EB"/><text x="612" y="209" class="tiny" text-anchor="middle" fill="#fff">3</text><text x="640" y="206" class="h3" text-anchor="start">知识检索</text><text x="604" y="242" class="muted" text-anchor="start">文献/笔记/证据</text><rect x="830" y="170" width="210" height="110" rx="18" fill="#fff" stroke="#DDE6F3" /><circle cx="862" cy="204" r="16" fill="#2563EB"/><text x="862" y="209" class="tiny" text-anchor="middle" fill="#fff">4</text><text x="890" y="206" class="h3" text-anchor="start">理论匹配</text><text x="85