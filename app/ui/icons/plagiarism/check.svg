<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- 论文查重主图标 - 现代化设计：文档+AI放大镜 -->
  <defs>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#5a67d8"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0366d6"/>
      <stop offset="100%" stop-color="#0256c2"/>
    </linearGradient>
  </defs>

  <!-- 文档主体 -->
  <path d="M6 2a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h7.5a6 6 0 0 1-1.5-4 6 6 0 0 1 2-4.5V8l-6-6H6z"
        fill="#ffffff" stroke="url(#docGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 文档折角 -->
  <path d="M14 2v6h6" fill="none" stroke="url(#docGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 文档内容线条 -->
  <line x1="7" y1="11" x2="11" y2="11" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="7" y1="14" x2="10" y2="14" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 放大镜圆圈 -->
  <circle cx="16.5" cy="16.5" r="4.5" fill="#ffffff" stroke="url(#glassGrad)" stroke-width="2"/>

  <!-- AI神经网络节点 -->
  <circle cx="15.5" cy="15.5" r="0.8" fill="#0366d6"/>
  <circle cx="17.5" cy="15.5" r="0.8" fill="#0366d6"/>
  <circle cx="16.5" cy="17.5" r="0.8" fill="#0366d6"/>
  <line x1="15.5" y1="15.5" x2="17.5" y2="15.5" stroke="#0366d6" stroke-width="0.8" opacity="0.6"/>
  <line x1="15.5" y1="15.5" x2="16.5" y2="17.5" stroke="#0366d6" stroke-width="0.8" opacity="0.6"/>
  <line x1="17.5" y1="15.5" x2="16.5" y2="17.5" stroke="#0366d6" stroke-width="0.8" opacity="0.6"/>

  <!-- 放大镜手柄 -->
  <line x1="19.5" y1="19.5" x2="22" y2="22" stroke="url(#glassGrad)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
